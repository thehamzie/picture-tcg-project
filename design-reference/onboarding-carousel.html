<!--
  Design reference exported from an in-chat mockup tool — not meant to be opened directly in a browser.
  Read as code for layout, spacing, and interaction structure when building the React Native screen;
  this is a reference, not literal markup to port.

  CSS custom properties like var(--surface-1), var(--surface-2), var(--text-secondary), var(--border-strong),
  and var(--fill-accent) are host-theme tokens from the mockup tool and are NOT defined in this file. Treat them as:
    --surface-1 / --surface-2       -> light neutral background surfaces
    --text-secondary                -> muted gray body/label text
    --border-strong                 -> light gray hairline border
    --fill-accent                   -> the app's primary brand/accent color (not yet decided — see CLAUDE.md open decisions)

  NOTE: the icon circle below uses class="c-coral" / "c-teal" / "c-pink" instead of a hardcoded hex — these are
  the mockup tool's own color-ramp classes and won't resolve to anything outside it. Map them to CLAUDE.md's
  real hex values instead: c-coral -> #D85A30 (adventure), c-teal -> #1D9E75 (calm), c-pink -> #D4537E (together).

  Icons use Tabler Icons font classes (e.g. "ti ti-camera") as a stand-in — swap for @expo/vector-icons'
  Tabler/Feather equivalents in the real app.
-->

<h2 class="sr-only">Mockup of a three-step onboarding flow for the Everdot app, introducing the one-photo-a-day concept, the calendar view, and a reminder time picker, with a skip option and paginated progress dots.</h2>

<div style="max-width:300px;margin:0 auto;">
  <div style="background:var(--surface-1);border-radius:40px;padding:10px;border:0.5px solid var(--border);">
    <div style="background:var(--surface-2);border-radius:32px;padding:20px 20px 16px;min-height:380px;display:flex;flex-direction:column;">

      <div style="display:flex;justify-content:flex-end;">
        <button id="skip-btn" style="background:transparent;border:none;font-size:12px;color:var(--text-secondary);padding:4px 8px;">skip</button>
      </div>

      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 6px;">
        <div id="ob-icon" style="width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <i id="ob-icon-i" style="font-size:34px;" aria-hidden="true"></i>
        </div>
        <p id="ob-title" style="font-size:17px;font-weight:500;margin:0;"></p>
        <p id="ob-sub" style="font-size:13px;color:var(--text-secondary);margin:0;line-height:1.5;"></p>
        <div id="ob-extra" style="display:none;margin-top:4px;">
          <input type="time" value="20:00" />
        </div>
      </div>

      <div style="display:flex;justify-content:center;gap:6px;margin:12px 0;" id="ob-dots"></div>

      <button id="ob-next" style="width:100%;font-size:14px;font-weight:500;background:var(--surface-1);"></button>

    </div>
  </div>
</div>

<script>
const steps = [
  {color:'c-coral', icon:'ti-camera', title:'one day, one photo', sub:'no clutter, just the moments that mattered.', extra:false},
  {color:'c-teal', icon:'ti-calendar', title:'watch your year fill in', sub:'each day gets its own little dot on the calendar.', extra:false},
  {color:'c-pink', icon:'ti-bell', title:"we'll remind you", sub:'pick a time that works for you.', extra:true}
];
let step = 0;
const icon = document.getElementById('ob-icon');
const iconI = document.getElementById('ob-icon-i');
const title = document.getElementById('ob-title');
const sub = document.getElementById('ob-sub');
const extra = document.getElementById('ob-extra');
const dots = document.getElementById('ob-dots');
const nextBtn = document.getElementById('ob-next');
const skipBtn = document.getElementById('skip-btn');

function render() {
  const s = steps[step];
  icon.className = s.color;
  iconI.className = 'ti ' + s.icon;
  title.textContent = s.title;
  sub.textContent = s.sub;
  extra.style.display = s.extra ? 'block' : 'none';
  dots.innerHTML = steps.map((_, i) => '<span style="width:' + (i === step ? '16px' : '6px') + ';height:6px;border-radius:3px;background:' + (i === step ? 'var(--fill-accent)' : 'var(--border-strong)') + ';display:inline-block;transition:width 0.25s;"></span>').join('');
  nextBtn.textContent = step === steps.length - 1 ? 'get started' : 'next';
  skipBtn.style.visibility = step === steps.length - 1 ? 'hidden' : 'visible';
}
render();

nextBtn.addEventListener('click', () => {
  step = step === steps.length - 1 ? 0 : step + 1;
  render();
});
skipBtn.addEventListener('click', () => {
  step = steps.length - 1;
  render();
});
</script>
