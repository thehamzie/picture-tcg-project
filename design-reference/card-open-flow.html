<!--
  Design reference exported from an in-chat mockup tool — not meant to be opened directly in a browser.
  Read as code for layout, spacing, and interaction structure when building the React Native screen;
  this is a reference, not literal markup to port.

  This is the "Open" tab / daily capture reveal flow: face-down card -> tap to flip -> optional vibe
  tagging chips -> streak-based + random holo rarity (see the `streak % 7 === 0` milestone check plus
  the ~8% baseline random chance in the click handler below — exact odds/cadence still open per CLAUDE.md).

  In the real app, this flip should happen AFTER a real photo is captured via expo-camera/expo-image-picker
  and saved (per the phase-2 data loop already built) — this mockup uses a generic photo icon as a stand-in
  for the actual captured photo, which should fill the card front instead once wired up.

  CSS custom properties like var(--surface-1), var(--surface-2), var(--text-secondary), var(--border), and
  var(--border-strong) are host-theme tokens from the mockup tool and are NOT defined in this file. Treat
  them as:
    --surface-1 / --surface-2  -> light neutral background surfaces
    --text-secondary            -> muted gray body/label text
    --border / --border-strong  -> light gray hairline borders

  Hardcoded hex colors in the `types` array (#BA7517, #1D9E75, #D4537E, #D85A30, #7F77DD) ARE the real
  intended vibe-palette colors and should be preserved — see CLAUDE.md for the full color table.

  Icons use Tabler Icons font classes (e.g. "ti ti-camera") as a stand-in — swap for @expo/vector-icons'
  Tabler/Feather equivalents in the real app.
-->

<h2 class="sr-only">Updated mockup of Everdot's card reveal flow with bold, fully-coloured vibe chips and a card front that fills with saturated colour once a vibe is chosen, plus the streak-based holo rarity logic.</h2>

<div style="max-width:280px;margin:0 auto;">
  <div style="background:var(--surface-1);border-radius:40px;padding:10px;border:0.5px solid var(--border);">
    <div style="background:var(--surface-2);border-radius:32px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;">

      <div style="display:flex;align-items:center;gap:6px;">
        <i class="ti ti-calendar" style="font-size:15px;color:var(--text-accent);" aria-hidden="true"></i>
        <span style="font-weight:500;font-size:14px;">today's card</span>
      </div>

      <p id="streak-label" style="font-size:12px;color:var(--text-secondary);margin:0;text-align:center;">day 6 of your streak</p>

      <div style="perspective:900px;width:140px;height:196px;position:relative;">
        <div id="flip-inner" style="width:100%;height:100%;position:relative;transition:transform 0.6s;transform-style:preserve-3d;">
          <div id="card-back" style="position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;background:var(--surface-1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;">
            <i class="ti ti-camera" style="font-size:30px;color:var(--text-muted);" aria-hidden="true"></i>
          </div>
          <div id="card-front" style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);border-radius:12px;background:var(--surface-1);border:0.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
            <i id="front-icon" class="ti ti-photo" style="font-size:32px;color:var(--text-muted);" aria-hidden="true"></i>
            <span id="front-label" style="font-size:12px;font-weight:500;color:var(--text-secondary);">no vibe yet</span>
            <span id="front-day" style="position:absolute;bottom:6px;right:8px;font-size:9px;opacity:0.85;">jul 30</span>
            <i id="front-star" class="ti ti-star" style="position:absolute;top:6px;right:6px;font-size:12px;display:none;" aria-hidden="true"></i>
          </div>
        </div>
        <div id="confetti-layer" style="position:absolute;inset:0;pointer-events:none;"></div>
      </div>

      <div id="chip-row" style="display:none;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="vibe-chip" data-idx="0" aria-label="Golden" style="width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:none;"><i class="ti ti-sun" style="font-size:15px;" aria-hidden="true"></i></button>
        <button class="vibe-chip" data-idx="1" aria-label="Calm" style="width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:none;"><i class="ti ti-moon" style="font-size:15px;" aria-hidden="true"></i></button>
        <button class="vibe-chip" data-idx="2" aria-label="Together" style="width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:none;"><i class="ti ti-heart" style="font-size:15px;" aria-hidden="true"></i></button>
        <button class="vibe-chip" data-idx="3" aria-label="Adventure" style="width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:none;"><i class="ti ti-bolt" style="font-size:15px;" aria-hidden="true"></i></button>
        <button class="vibe-chip" data-idx="4" aria-label="Cozy" style="width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:none;"><i class="ti ti-coffee" style="font-size:15px;" aria-hidden="true"></i></button>
        <button id="chip-skip" aria-label="Leave plain" style="width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border-strong);"><i class="ti ti-x" style="font-size:15px;color:var(--text-muted);" aria-hidden="true"></i></button>
      </div>

      <button id="open-btn" style="width:100%;font-size:14px;font-weight:500;background:var(--surface-1);">open card</button>
    </div>
  </div>
</div>

<script>
const types = [
  {label:'golden', bg:'#BA7517', icon:'ti-sun'},
  {label:'calm', bg:'#1D9E75', icon:'ti-moon'},
  {label:'together', bg:'#D4537E', icon:'ti-heart'},
  {label:'adventure', bg:'#D85A30', icon:'ti-bolt'},
  {label:'cozy', bg:'#7F77DD', icon:'ti-coffee'}
];
document.querySelectorAll('.vibe-chip').forEach((chip) => {
  const t = types[parseInt(chip.dataset.idx, 10)];
  chip.style.background = t.bg;
  chip.style.color = '#fff';
});

const streakLabel = document.getElementById('streak-label');
const flipInner = document.getElementById('flip-inner');
const cardFront = document.getElementById('card-front');
const frontIcon = document.getElementById('front-icon');
const frontLabelEl = document.getElementById('front-label');
const frontStar = document.getElementById('front-star');
const openBtn = document.getElementById('open-btn');
const confettiLayer = document.getElementById('confetti-layer');
const chipRow = document.getElementById('chip-row');
let opened = false;
let streak = 6;
let isHolo = false;

function resetCardVisual() {
  cardFront.style.background = 'var(--surface-1)';
  cardFront.style.border = '0.5px solid var(--border)';
  cardFront.style.color = '';
  frontIcon.className = 'ti ti-photo';
  frontIcon.style.color = 'var(--text-muted)';
  frontLabelEl.textContent = 'no vibe yet';
  frontLabelEl.style.color = 'var(--text-secondary)';
}

function popConfetti() {
  const dotColors = ['#BA7517','#D4537E','#1D9E75','#7F77DD','#D85A30'];
  for (let i = 0; i < 8; i++) {
    const dot = document.createElement('span');
    dot.style.position = 'absolute';
    dot.style.width = '6px';
    dot.style.height = '6px';
    dot.style.borderRadius = '50%';
    dot.style.background = dotColors[i % dotColors.length];
    dot.style.left = '50%';
    dot.style.top = '50%';
    dot.style.transition = 'transform 0.7s ease-out, opacity 0.7s ease-out';
    confettiLayer.appendChild(dot);
    const angle = (Math.PI * 2 * i) / 8;
    const dist = 60;
    requestAnimationFrame(() => {
      dot.style.transform = 'translate(' + Math.cos(angle) * dist + 'px,' + Math.sin(angle) * dist + 'px)';
      dot.style.opacity = '0';
    });
    setTimeout(() => dot.remove(), 750);
  }
}

let shimmerInterval = null;

function applyHoloShimmer() {
  let hi = 0;
  shimmerInterval = setInterval(() => {
    if (!opened || !isHolo) { clearInterval(shimmerInterval); return; }
    hi++;
    cardFront.style.background = types[hi % types.length].bg;
  }, 550);
}

openBtn.addEventListener('click', () => {
  if (!opened) {
    streak++;
    const milestone = streak % 7 === 0;
    isHolo = milestone || Math.random() < 0.08;
    streakLabel.textContent = milestone ? 'day ' + streak + ' \u00b7 streak milestone!' : 'day ' + streak + ' of your streak';
    resetCardVisual();
    frontStar.style.display = isHolo ? 'block' : 'none';
    if (isHolo) {
      cardFront.style.border = '2px solid #fff';
      cardFront.style.background = types[0].bg;
      cardFront.style.color = '#fff';
      frontIcon.style.color = '#fff';
    }
    flipInner.style.transform = 'rotateY(180deg)';
    opened = true;
    openBtn.textContent = 'flip back';
    chipRow.style.display = 'flex';
    setTimeout(popConfetti, 400);
    if (isHolo) setTimeout(applyHoloShimmer, 450);
  } else {
    flipInner.style.transform = 'rotateY(0deg)';
    opened = false;
    isHolo = false;
    openBtn.textContent = 'open card';
    chipRow.style.display = 'none';
  }
});

document.querySelectorAll('.vibe-chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    if (!opened) return;
    const t = types[parseInt(chip.dataset.idx, 10)];
    if (!isHolo) cardFront.style.background = t.bg;
    cardFront.style.border = isHolo ? '2px solid #fff' : 'none';
    cardFront.style.color = '#fff';
    frontIcon.className = 'ti ' + t.icon;
    frontIcon.style.color = '#fff';
    frontLabelEl.textContent = t.label;
    frontLabelEl.style.color = '#fff';
  });
});

document.getElementById('chip-skip').addEventListener('click', () => {
  if (!opened) return;
  if (isHolo) {
    clearInterval(shimmerInterval);
    isHolo = false;
  }
  resetCardVisual();
  frontStar.style.display = 'none';
});
</script>
